name: authoros_persistence
description: >-
  AuthorOS's embedded project database: the Drift schema, its migrations and
  DriftConnectedDomainRepository. AuthorOS Write and the standalone
  applications open their projects through it; none of them keeps a store of
  its own (ADR-0028).
publish_to: none
version: 0.2.3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  # Pinned by commit. An application that depends on this package pins
  # authoros_core at the same commit, or pub reports the conflict.
  authoros_core:
    git:
      url: https://github.com/Ink-Insight-Software/authoros-core.git
      ref: 1b2bc7549cd6cc69756ef23e503fa0713982277d
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter

dev_dependencies:
  # The schema's generated file lives beside it and is regenerated here:
  # `dart run build_runner build --delete-conflicting-outputs`.
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
