name: authoros_persistence
description: >-
  AuthorOS's embedded project database: the Drift schema, its migrations and
  DriftConnectedDomainRepository. AuthorOS Write and the standalone
  applications open their projects through it; none of them keeps a store of
  its own (ADR-0028).
publish_to: none
version: 0.2.14

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  # Pinned by commit. An application that depends on this package pins
  # authoros_core at the same commit, or pub reports the conflict.
  authoros_core:
    git:
      url: https://github.com/Ink-Insight-Software/authoros-core.git
      ref: 0087e182401710b4f47aecc8b28e38852b0fbec9
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter

dev_dependencies:
  # The schema's generated file lives beside it and is regenerated here:
  # `dart run build_runner build --delete-conflicting-outputs`.
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter

# For this package's own checks only: pub ignores a dependency's overrides, so
# no application is held to this. drift 2.35 deprecates `$_getPrefetchedData`,
# which the generated schema file calls, and `flutter analyze` here treats an
# info as fatal. With no lockfile the range above floats, so the check is held
# to the version AuthorOS Write locks. Regenerating the schema file under a
# newer drift is the other fix, and a change to what ships.
dependency_overrides:
  drift: 2.34.3
